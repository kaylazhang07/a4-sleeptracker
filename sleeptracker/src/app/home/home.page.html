<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Sleep Tracker</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleep Tracker</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button expand="block" routerLink="/log-overnight">Log last night</ion-button>
  <ion-list>
    @for (entry of entries; track entry.id){
      <ion-item>
        <ion-label>
          <h2>{{ entry.summaryString() }}</h2>
          <p>{{ entry.dateString() }}</p>
        </ion-label>
      </ion-item>
    } @empty {
      <ion-item>
        <ion-label>No logs yet</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
